openapi: 3.1.0
info:
  title: A-share Market Discussion Data
  version: 3.2.2
  description: >
    Read-only A-share market data and breakout-strategy context. Tushare is preferred;
    Tencent/Eastmoney/Sina are realtime fallbacks with explicit freshness, coverage and
    cross-check quality. V3.2.2 adds market regime, full-industry ignition ranking,
    style-index matrix and B0/B1/B2/B3/FAILED breakout scanning. No order functions.
servers:
  - url: https://tushare-chatgpt-bridge.netlify.app
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the market-data service is online and get its version.
      responses:
        "200": { description: Health status }

  /diagnostics/providers:
    get:
      operationId: diagnoseDataProviders
      summary: Diagnose Tushare and free fallback provider availability for one stock.
      description: >
        Returns provider reachability, latency, source timestamps, quote consensus,
        and last-minute-bar status. Use after deployment or when realtime data looks stale.
      parameters:
        - name: ts_code
          in: query
          required: false
          schema: { type: string, default: 600522.SH }
        - name: freq
          in: query
          required: false
          schema: { type: string, enum: [1MIN, 5MIN, 15MIN, 30MIN, 60MIN], default: 5MIN }
      responses:
        "200": { description: Provider diagnostics }

  /market/overview:
    get:
      operationId: getMarketOverview
      summary: Get current A-share market overview with explicit realtime/fallback coverage.
      description: >
        Uses full realtime market breadth only when the selected provider returns adequate
        coverage. Otherwise breadth remains the latest completed Tushare daily session while
        realtime indices/leaders may be supplied separately and clearly labeled.
      responses:
        "200": { description: Market overview with source and freshness metadata }

  /market/sentiment:
    get:
      operationId: getMarketSentiment
      summary: Get market sentiment, limit boards and breadth with explicit coverage semantics.
      description: >
        Combines available realtime quotes with official Tushare limit prices. If only a ranked
        realtime subset is available, counts are labeled observed lower bounds, not whole-market totals.
        Advanced KPL/limit-step fields automatically become available when Tushare permissions allow.
      responses:
        "200": { description: Market sentiment }

  /market/sectors:
    get:
      operationId: getMarketSectors
      summary: Rank all available industries by ignition strength, breadth and turnover expansion.
      description: >
        Uses the full A-share quote universe plus Tushare industry metadata and recent daily data.
        Returns 1/3/5/10-day member-return proxies, breadth, turnover expansion and ignition status.
      parameters:
        - { name: top_n, in: query, required: false, schema: { type: integer, default: 100, minimum: 10, maximum: 100 } }
        - { name: history_sessions, in: query, required: false, schema: { type: integer, default: 10, minimum: 5, maximum: 10 } }
      responses:
        "200": { description: Full-industry ignition ranking }

  /market/breakouts:
    get:
      operationId: getMarketBreakouts
      summary: Scan A-shares for B0 pre-breakout, B1 launch and B2 first-retest setups.
      description: >
        Starts from the full A-share realtime cross-section, then qfq-confirms a bounded candidate pool
        with Tushare history. B3 means extended/do-not-chase; FAILED means breakout failure.
      parameters:
        - { name: scan_limit, in: query, required: false, schema: { type: integer, default: 36, minimum: 20, maximum: 60 } }
        - { name: top_n, in: query, required: false, schema: { type: integer, default: 15, minimum: 5, maximum: 30 } }
        - { name: min_amount_million, in: query, required: false, schema: { type: number, default: 150, minimum: 20 } }
      responses:
        "200": { description: Breakout candidates, stages, scores and execution zones }

  /market/scan:
    get:
      operationId: getMarketScan
      summary: Scan strong industries and realtime market leaders with source/coverage metadata.
      parameters:
        - { name: sector_top_n, in: query, required: false, schema: { type: integer, default: 8, minimum: 3, maximum: 15 } }
        - { name: leaders_per_sector, in: query, required: false, schema: { type: integer, default: 4, minimum: 1, maximum: 8 } }
        - { name: market_top_n, in: query, required: false, schema: { type: integer, default: 15, minimum: 5, maximum: 30 } }
        - { name: min_amount_million, in: query, required: false, schema: { type: number, default: 100, minimum: 0 } }
      responses:
        "200": { description: Market scan }

  /market/themes:
    get:
      operationId: getMarketThemes
      summary: Evaluate concept themes and retrieve dated strong-theme context.
      description: >
        Tushare THS concept definitions/members are preferred when permitted. If unavailable,
        Eastmoney concept boards/members are used as a realtime fallback. Advanced Tushare
        strong-theme and concept-moneyflow datasets remain available automatically when permissions increase.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Concept name or comma-separated names, e.g. MLCC,创新药,光通信.
        - { name: top_n, in: query, required: false, schema: { type: integer, default: 8, minimum: 3, maximum: 15 } }
        - { name: leaders, in: query, required: false, schema: { type: integer, default: 5, minimum: 3, maximum: 10 } }
      responses:
        "200": { description: Theme evaluation and context }

  /stock/{ts_code}/snapshot:
    get:
      operationId: getStockSnapshot
      summary: Preferred one-call stock snapshot for current trading discussion.
      description: >
        Current stock quote, qfq technicals, volume quality, minute status, moneyflow,
        valuation and margin context. Tushare is preferred; Tencent/Eastmoney/Sina are fallbacks.
      parameters:
        - name: ts_code
          in: path
          required: true
          schema: { type: string }
          description: Tushare stock code such as 600522.SH.
        - name: freq
          in: query
          required: false
          schema: { type: string, enum: [1MIN, 5MIN, 15MIN, 30MIN, 60MIN], default: 5MIN }
        - name: daily_days
          in: query
          required: false
          schema: { type: integer, minimum: 80, maximum: 500, default: 180 }
      responses:
        "200": { description: Stock snapshot }

  /stock/{ts_code}/intraday:
    get:
      operationId: getStockIntraday
      summary: Get current-session intraday minute bars using Tushare first, then fallbacks.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - name: freq
          in: query
          required: false
          schema: { type: string, enum: [1MIN, 5MIN, 15MIN, 30MIN, 60MIN], default: 5MIN }
      responses:
        "200": { description: Intraday bars with quality metadata }

  /stock/{ts_code}/daily:
    get:
      operationId: getStockDaily
      summary: Get Tushare qfq daily bars for one stock.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 20, maximum: 500, default: 120 } }
      responses:
        "200": { description: QFQ daily bars }

  /stock/{ts_code}/moneyflow:
    get:
      operationId: getStockMoneyflow
      summary: Get recent post-close stock moneyflow, preferring THS then standard Tushare moneyflow.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 120, default: 20 } }
      responses:
        "200": { description: Moneyflow history }

  /stock/{ts_code}/context:
    get:
      operationId: getStockTradingContext
      summary: Get post-close turnover/valuation, margin, optional chip-cost and KPL context.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 20, maximum: 240, default: 90 } }
      responses:
        "200": { description: Stock trading context }

  /stock/{ts_code}/lhb:
    get:
      operationId: getStockDragonTiger
      summary: Get recent Dragon-Tiger List institution/broker-seat detail when permitted.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - name: trade_date
          in: query
          required: false
          schema: { type: string, pattern: '^\d{8}$' }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        "200": { description: Dragon-Tiger List details }

  /stock/{ts_code}/risk-events:
    get:
      operationId: getStockRiskEvents
      summary: Get upcoming/recent event-risk context for one stock.
      description: Includes share unlocks, holder changes, earnings forecasts, disclosure schedule and repurchase records when permitted.
      parameters:
        - { name: ts_code, in: path, required: true, schema: { type: string } }
        - { name: forward_days, in: query, required: false, schema: { type: integer, minimum: 30, maximum: 365, default: 90 } }
        - { name: backward_days, in: query, required: false, schema: { type: integer, minimum: 30, maximum: 365, default: 120 } }
      responses:
        "200": { description: Stock event-risk context }

components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
